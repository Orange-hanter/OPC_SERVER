name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tsan:
    name: TSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ libsqlite3-dev
      - name: Configure
        run: cmake --preset tsan -DCMAKE_CXX_COMPILER=g++
      - name: Build
        run: cmake --build --preset tsan
      - name: Test
        run: ctest --preset tsan --timeout 240

  e2e:
    name: Lab E2E
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ libsqlite3-dev
      - name: Configure
        run: cmake --preset ci -DCMAKE_CXX_COMPILER=g++
      - name: Build
        run: cmake --build --preset ci
      - name: E2E
        env:
          OPC_E2E: "1"
        run: ./build/ci/tests/opc_tests "[e2e]"

  coverage:
    name: Coverage domain/core/project
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ libsqlite3-dev gcovr
      - name: Configure
        run: cmake --preset coverage -DCMAKE_CXX_COMPILER=g++
      - name: Build
        run: cmake --build --preset coverage
      - name: Test
        run: ctest --preset coverage --timeout 180
      - name: Report
        run: ./scripts/coverage.sh

  soak:
    name: Short soak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ libsqlite3-dev
      - name: Configure
        run: cmake --preset ci -DCMAKE_CXX_COMPILER=g++
      - name: Build
        run: cmake --build --preset ci
      - name: Soak
        env:
          OPC_SOAK: "1"
        run: ./build/ci/tests/opc_tests "[soak]"

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (ubuntu-24.04 / g++)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ libsqlite3-dev libssl-dev \
            libcurl4-openssl-dev protobuf-compiler libprotobuf-dev

      - name: Configure
        run: cmake --preset ci -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci --timeout 120
        # OPC UA smoke tests bind ephemeral ports; keep modest parallelism.

      - name: OTLP live collector smoke
        run: |
          chmod +x scripts/ci/otlp_smoke.sh scripts/ci/otlp_http_receiver.py
          OPC_BUILD_DIR="${GITHUB_WORKSPACE}/build/ci" ./scripts/ci/otlp_smoke.sh

      - name: Package binaries
        run: |
          cmake --install build/ci --prefix stage --component opc-server
          mkdir -p dist/opc-server-linux-x64
          cp -a stage/bin/* dist/opc-server-linux-x64/
          cp README.md LICENSE dist/opc-server-linux-x64/
          mkdir -p dist/opc-server-linux-x64/examples
          cp -a stage/share/opc-server/examples/* dist/opc-server-linux-x64/examples/
          (cd dist && tar -czf opc-server-linux-x64.tar.gz opc-server-linux-x64)
          (cd dist && sha256sum opc-server-linux-x64.tar.gz > opc-server-linux-x64.tar.gz.sha256)
          ls -la dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opc-server-linux-x64
          path: |
            dist/opc-server-linux-x64.tar.gz
            dist/opc-server-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  asan:
    name: ASan + UBSan (ubuntu-24.04 / g++)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ libsqlite3-dev libssl-dev

      - name: Configure
        run: cmake --preset asan -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build --preset asan --target opc_tests

      - name: Test
        run: ctest --preset asan --timeout 180
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  tsan:
    name: TSan core/runtime (ubuntu-24.04 / g++)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ libsqlite3-dev libssl-dev

      - name: Configure
        run: cmake --preset tsan -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build --preset tsan --target opc_tests

      - name: Test
        # open62541 is not built with TSan; skip UA client/server smoke and monitor browse.
        run: >
          ctest --preset tsan --timeout 180
          -E "OpcUa|OPC UA|UA Write|UA Subscription|UA write|opc-monitor browses|SignAndEncrypt"
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1

  conan:
    name: Conan 2 dependency provider
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ libsqlite3-dev libssl-dev
          pipx install conan

      - name: Create Conan profile
        run: CC=gcc CXX=g++ conan profile detect --force

      - name: Build and test through Conan
        run: |
          CC=gcc CXX=g++ conan build . \
            -s build_type=Debug \
            -s compiler.cppstd=23 \
            --build=missing

  studio-quality:
    name: Studio lint, test & build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend/apps/studio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/apps/studio/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: End-to-end test
        run: npm run test:e2e

      - name: Build web assets
        run: npm run build

  studio-package:
    name: Studio package (${{ matrix.target }})
    needs: [build-test, studio-quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            suffix: ".exe"
          - runner: macos-14
            target: aarch64-apple-darwin
            suffix: ""
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ libsqlite3-dev libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Ninja on macOS
        if: runner.os == 'macOS'
        run: brew install ninja sqlite llvm openssl@3

      - name: Install OpenSSL on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install openssl --no-progress -y
          echo "OPENSSL_ROOT_DIR=C:/Program Files/OpenSSL-Win64" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=C:/Program Files/OpenSSL-Win64" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/apps/studio/package-lock.json

      - name: Build native sidecars
        shell: bash
        run: |
          EXTRA_CMAKE_ARGS=()
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            LLVM_PREFIX="$(brew --prefix llvm)"
            OPENSSL_PREFIX="$(brew --prefix openssl@3)"
            EXTRA_CMAKE_ARGS+=(
              -DCMAKE_C_COMPILER="${LLVM_PREFIX}/bin/clang"
              -DCMAKE_CXX_COMPILER="${LLVM_PREFIX}/bin/clang++"
              -DOPENSSL_ROOT_DIR="${OPENSSL_PREFIX}"
            )
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            EXTRA_CMAKE_ARGS+=(
              -DOPENSSL_ROOT_DIR="${OPENSSL_ROOT_DIR}"
            )
          fi
          cmake -S . -B build-studio -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            "${EXTRA_CMAKE_ARGS[@]}"
          cmake --build build-studio --target opc-map opc-monitor --parallel
          mkdir -p frontend/apps/studio/src-tauri/binaries
          cp "build-studio/tools/opc-map/opc-map${{ matrix.suffix }}" \
            "frontend/apps/studio/src-tauri/binaries/opc-map-${{ matrix.target }}${{ matrix.suffix }}"
          cp "build-studio/tools/opc-monitor/opc-monitor${{ matrix.suffix }}" \
            "frontend/apps/studio/src-tauri/binaries/opc-monitor-${{ matrix.target }}${{ matrix.suffix }}"

      - name: Install frontend dependencies
        working-directory: frontend/apps/studio
        run: npm ci

      - name: Build desktop package
        working-directory: frontend/apps/studio
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: opc-engineering-studio-${{ matrix.target }}
          path: frontend/apps/studio/src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
          retention-days: 14

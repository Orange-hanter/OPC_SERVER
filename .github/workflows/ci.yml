name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (ubuntu-24.04 / g++)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ libsqlite3-dev

      - name: Configure
        run: cmake --preset ci -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci --timeout 120
        # OPC UA smoke tests bind ephemeral ports; keep modest parallelism.

      - name: Package binaries
        run: |
          cmake --install build/ci --prefix stage --component opc-server
          mkdir -p dist/opc-server-linux-x64
          cp -a stage/bin/* dist/opc-server-linux-x64/
          cp README.md LICENSE dist/opc-server-linux-x64/
          mkdir -p dist/opc-server-linux-x64/examples
          cp -a stage/share/opc-server/examples/* dist/opc-server-linux-x64/examples/
          (cd dist && tar -czf opc-server-linux-x64.tar.gz opc-server-linux-x64)
          (cd dist && sha256sum opc-server-linux-x64.tar.gz > opc-server-linux-x64.tar.gz.sha256)
          ls -la dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opc-server-linux-x64
          path: |
            dist/opc-server-linux-x64.tar.gz
            dist/opc-server-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  conan:
    name: Conan 2 dependency provider
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ libsqlite3-dev
          pipx install conan

      - name: Create Conan profile
        run: CC=gcc CXX=g++ conan profile detect --force

      - name: Build and test through Conan
        run: |
          CC=gcc CXX=g++ conan build . \
            -s build_type=Debug \
            -s compiler.cppstd=23 \
            --build=missing

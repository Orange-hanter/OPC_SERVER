name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: g++
            cxx: g++
            cmake_extra: ""
            artifact_name: opc-server-linux-x64
          - os: ubuntu-24.04
            compiler: clang++
            cxx: clang++
            # Use libstdc++ so std::expected (C++23) is available on Ubuntu runners.
            cmake_extra: "-DCMAKE_CXX_FLAGS=-stdlib=libstdc++"
            artifact_name: opc-server-linux-x64-clang

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++
          if [ "${{ matrix.compiler }}" = "clang++" ]; then
            sudo apt-get install -y clang
          fi

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel

      - name: Package binaries
        if: matrix.compiler == 'g++'
        run: |
          cmake --install build --prefix stage
          mkdir -p dist/${{ matrix.artifact_name }}
          cp -a stage/bin/* dist/${{ matrix.artifact_name }}/
          cp README.md LICENSE dist/${{ matrix.artifact_name }}/ 2>/dev/null || cp README.md dist/${{ matrix.artifact_name }}/
          mkdir -p dist/${{ matrix.artifact_name }}/examples
          cp DOCs/examples/demo-plant.modbusproj.json dist/${{ matrix.artifact_name }}/examples/
          cp DOCs/schemas/modbus-project.schema.json dist/${{ matrix.artifact_name }}/examples/
          (cd dist && tar -czf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }})
          (cd dist && sha256sum ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256)
          ls -la dist/

      - name: Upload build artifacts
        if: matrix.compiler == 'g++'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.artifact_name }}.tar.gz
            dist/${{ matrix.artifact_name }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

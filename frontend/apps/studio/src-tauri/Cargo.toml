[package]
name = "opc-engineering-studio"
version = "0.1.0"
description = "Desktop project editor and OPC UA monitor for OPC_SERVER"
authors = ["OPC_SERVER contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "opc_engineering_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tempfile = "3"
tokio = { version = "1.53.1", features = ["sync"] }
